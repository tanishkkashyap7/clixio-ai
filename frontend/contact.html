<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clixio - Contact Us</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background-color: #000000;
      color: #f0f0f0;
      line-height: 1.6;
    }
    header {
      background-color: #48494a;
      color: #ffffff;
      padding: 40px 20px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 2.2rem;
    }
    header p {
      font-size: 1rem;
      margin-top: 10px;
      color: #c0c0c0;
    }
    main {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background-color: #1a1a1a;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    section {
      padding: 20px;
    }
    section h2 {
      color: #4A90E2;
      font-size: 1.5rem;
      margin-bottom: 15px;
    }
    form {
      display: flex;
      flex-direction: column;
    }
    label {
      margin-bottom: 5px;
      font-weight: 500;
    }
    input, textarea {
      margin-bottom: 20px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: #333;
      color: #f0f0f0;
      font-size: 1rem;
    }
    input:focus, textarea:focus {
      outline: 2px solid #4A90E2;
    }
    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: #4A90E2;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #357ABD;
    }
    footer {
      text-align: center;
      padding: 20px;
      background-color: #48494a;
      font-size: 0.9rem;
      color: #cccccc;
    }
    a {
      color: #4A90E2;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <h1>Contact Us</h1>
    <p>Have questions or feedback? Get in touch with Clixio!</p>
  </header>

  <main>
    <section>
      <h2>Send Us a Message</h2>
      <form action="mailto:support@clixio.com" method="post" enctype="text/plain">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Your email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" placeholder="Your message" required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </section>

    <section>
      <h2>Our Contact Details</h2>
      <p>Email: <a href="mailto:support@clixio.com">support@clixio.com</a></p>
      <p>Website: <a href="https://www.clixio.com" target="_blank">www.clixio.com</a></p>
    </section>
  </main>

  <footer>
    &copy; 2025 Clixio. All rights reserved. | <a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms & Conditions</a>
  </footer>

</body>
</html>
