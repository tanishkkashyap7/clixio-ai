<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hover About Example</title>
  <style>
    .about-container {
      position: relative;
      display: inline-block;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
    }

    .about-text {
      display: none; 
      position: absolute;
      top: 25px; 
      left: 0;
      width: 250px;
      background: #f0f0f0;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      font-size: 14px;
    }

    .about-container:hover .about-text {
      display: block; 
    }
  </style>
</head>
<body>
  <div class="about-container">
    <span>About</span>
    <div class="about-text">
      This is a simple paragraph that appears when you hover over "About".
    </div>
  </div>
</body>
</html>
